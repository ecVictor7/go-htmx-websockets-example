<html>
    <head>
        <title>Vic's Hardware Monitor</title>
    </head>
    <body>
        <h1>Vic's Hardware Monitor</h1>
    <div hx-ext="ws" ws-connect="ws://localhost:8088/ws">
        <div id="update-timestamp">Loading data ...</div>

            <div id="system-data"></div>
            <div id="disk-data"></div>
            <div id="cpu-data"></div>
        </div>
    </div>

        ></script>
        <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/ws.js"></script>
    </body>
</html>
